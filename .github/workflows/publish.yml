name: publish site
on:
  push:
    branches:
      - main
permissions:
  contents: write
jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: 3.x
      - run: |
          pip install mkdocs-material
          pip install pymdown-extensions
          # バージョンを固定して最新に近いものを入れる
          pip install mkdocs-encryptcontent-plugin==3.0.1
      - run: mkdocs gh-deploy --force
