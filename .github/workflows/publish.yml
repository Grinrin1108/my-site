name: publish site
on:
  push:
    branches:
      - main
permissions:
  contents: write
jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"  # 3.xではなく3.12に固定

      - name: Install dependencies
        run: |
          pip install mkdocs-material
          # encryptcontentを最新(3.0.1)でインストール
          pip install mkdocs-encryptcontent-plugin==3.0.1
          # あなたが使っている拡張機能をすべてカバー
          pip install pymdown-extensions

      - name: Deploy to GitHub Pages
        run: mkdocs gh-deploy --force