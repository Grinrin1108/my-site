site_name: Grinrin's Site
theme:
  name: material
  palette:
    # ライトモード用
    - media: "(prefers-color-scheme: light)"
      scheme: default
      primary: indigo
      accent: indigo
      toggle:
        icon: material/brightness-7
        name: Switch to dark mode
    # ダークモード用
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      primary: indigo
      accent: indigo
      toggle:
        icon: material/brightness-4
        name: Switch to light mode
  features:
    - navigation.expand    # 最初から左メニューを開く
    - content.code.copy    # コードのコピーボタンを表示
    - content.code.annotate # コード内に注釈を入れられる
    - content.tooltips

markdown_extensions:
  - pymdownx.tasklist:
      custom_checkbox: true  # 見た目を綺麗にする設定
      clickable_checkbox: true # ブラウザ上でクリック可能にする（任意）
  - pymdownx.highlight:
      anchor_linenums: true
      line_spans: __span
      pygments_lang_class: true
  - pymdownx.inlinehilite
  - pymdownx.snippets
  - pymdownx.superfences: # これがないとコードブロックが綺麗に出ないことがあります
      custom_fences:
        - name: mermaid
          class: mermaid
          format: !!python/name:pymdownx.superfences.fence_code_format # ここをこれに書き換える
  - pymdownx.blocks.caption
  - toc:
      toc_depth: 2 # 右側のナビには ## まで表示する
  - pymdownx.critic
  - pymdownx.caret  # 上付き文字なども可能に
  - pymdownx.mark   # これが蛍光ペン機能
  - admonition
  - pymdownx.details  # 折りたたみ（???）が使えるようになります
  
  # ...他の設定（highlightやmarkなど）はそのまま残す

nav:
  - 🏠 Home: index.md
  - 📅 予定表: schedule/schedule.md
  - 📚 参考書管理: study/books.md
  - 🗓️ Daily Log:
      - 今月の記録: daily/2026_02/index.md
      - 集中レポート: daily/2026_02/reports.md
      - 過去のログ: daily/index.md
  - 💻 コマンド集:
      - Windowsプロンプト: commands/windows.md
      - Git操作: commands/git.md
      - Docker操作: commands/docker.md
  - 🏆 競プロ:
      - テンプレ: competitive_programming/template.md
  - 🤖 ロボット:
      - テンプレ: spike/template.md
  - 🔗 リンク集: link.md